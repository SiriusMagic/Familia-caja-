# Solo actualizaciones de SEGURIDAD, agrupadas en un PR por carpeta.
# open-pull-requests-limit: 0 apaga las actualizaciones de versión normales.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
