# Fusiona solo los PRs de Dependabot con cambios menores o de parche,
# y solo cuando todas las pruebas obligatorias pasan (auto-merge de GitHub).
# Las actualizaciones mayores quedan abiertas para revisarlas.
name: Fusión automática de Dependabot

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
